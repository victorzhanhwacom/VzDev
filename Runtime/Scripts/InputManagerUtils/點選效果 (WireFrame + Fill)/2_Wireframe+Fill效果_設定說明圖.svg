<svg width="680" height="540" viewBox="0 0 680 540" xmlns="http://www.w3.org/2000/svg" role="img" font-family="sans-serif">
<title>Wireframe + Fill 效果設定流程</title>
<desc>展示 StagingWireframeApplier 的設定步驟：建立兩個 Shader，準備 BarycentricMeshBaker 烘焙工具，掛在待上架模型上，按 Apply 按鈕產生兩個子物件疊加效果</desc>
<defs>
<marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="#5F5E5A" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker>
</defs>

<rect width="680" height="540" fill="#FFFFFF"/>

<g>
<rect x="60" y="40" width="560" height="56" rx="8" fill="#FAECE7" stroke="#993C1D" stroke-width="0.5"/>
<text x="340" y="60" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="500" fill="#712B13">建立兩個 Shader</text>
<text x="340" y="80" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#993C1D">StagingWireframeFill.shader ＋ StagingWireframeLines.shader</text>
</g>
<line x1="340" y1="96" x2="340" y2="130" stroke="#5F5E5A" stroke-width="1.5" marker-end="url(#arrow)"/>

<g>
<rect x="60" y="130" width="560" height="56" rx="8" fill="#FAECE7" stroke="#993C1D" stroke-width="0.5"/>
<text x="340" y="150" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="500" fill="#712B13">掛上 StagingWireframeApplier</text>
<text x="340" y="170" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#993C1D">掛在待上架設備模型上，拖入 Fill Shader ／ Line Shader</text>
</g>
<line x1="340" y1="186" x2="340" y2="220" stroke="#5F5E5A" stroke-width="1.5" marker-end="url(#arrow)"/>

<g>
<rect x="60" y="220" width="560" height="56" rx="8" fill="#FAEEDA" stroke="#854F0B" stroke-width="1"/>
<text x="340" y="240" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="500" fill="#633806">按下 Apply Staging Effect</text>
<text x="340" y="260" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#854F0B">內部呼叫 BarycentricMeshBaker，逐 Sub-mesh 烘焙重心座標到 UV2</text>
</g>
<line x1="340" y1="276" x2="340" y2="310" stroke="#5F5E5A" stroke-width="1.5" marker-end="url(#arrow)"/>

<g>
<rect x="80" y="310" width="250" height="56" rx="8" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="0.5"/>
<text x="205" y="330" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="500" fill="#2C2C2A">__StagingWireframeFill</text>
<text x="205" y="350" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#444441">半透明色調層</text>
</g>
<g>
<rect x="350" y="310" width="250" height="56" rx="8" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="0.5"/>
<text x="475" y="330" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="500" fill="#2C2C2A">__StagingWireframeLines</text>
<text x="475" y="350" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#444441">三角網格線層</text>
</g>
<line x1="205" y1="366" x2="205" y2="400" stroke="#5F5E5A" stroke-width="1.5" marker-end="url(#arrow)"/>
<line x1="475" y1="366" x2="475" y2="400" stroke="#5F5E5A" stroke-width="1.5" marker-end="url(#arrow)"/>

<g>
<rect x="60" y="400" width="560" height="70" rx="8" fill="#FAECE7" stroke="#993C1D" stroke-width="1"/>
<text x="340" y="422" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="500" fill="#712B13">效果顯示</text>
<text x="340" y="444" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#993C1D">兩層疊在原模型正上方，原本材質完全不變</text>
<text x="340" y="460" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#993C1D">調 Tint Color / Edge Color / Edge Thickness 即時生效</text>
</g>

<text x="340" y="500" text-anchor="middle" font-size="12" fill="#5F5E5A">Revert To Original 會刪除兩個子物件，不影響原始模型 Mesh／Material</text>
</svg>
